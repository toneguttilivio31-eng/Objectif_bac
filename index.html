/* ============================= BAC 2027 ============================= */
const BAC_EXAMS_2027 = [
  {id:'philo', label:'Philosophie', date:'2027-06-14', time:'08:00–12:00', coef:8, kind:'Terminale', note:'Épreuve finale écrite'},
  {id:'hggsp-bac', label:'HGGSP — spécialité', date:'2027-06-16', time:'08:00–12:00', coef:16, kind:'Spécialité', note:'Une des deux spécialités de Lorette'},
  {id:'ses-bac', label:'SES — spécialité', date:'2027-06-17', time:'08:00–12:00', coef:16, kind:'Spécialité', note:'Une des deux spécialités de Lorette'},
  {id:'grand-oral', label:'Grand oral', date:'2027-06-21', time:'21 juin → 2 juillet', coef:8, kind:'Terminale', note:'Date exacte fixée par l’académie · préparation liée aux spécialités'},
  {id:'francais-ecrit', label:'Français écrit', date:'2026-06-11', time:'08:00–12:00', coef:5, kind:'Première', note:'Épreuve anticipée — normalement déjà passée'},
  {id:'francais-oral', label:'Français oral', date:null, time:'Selon académie', coef:5, kind:'Première', note:'Épreuve anticipée — normalement déjà passée'},
  {id:'maths-anticipees', label:'Mathématiques — épreuve anticipée', date:'2026-06-12', time:'08:00–10:00', coef:2, kind:'Première', note:'Épreuve anticipée — normalement déjà passée'},
];
function bacMention(avg){ if(avg==null) return '—'; if(avg>=18) return 'Très bien · félicitations du jury'; if(avg>=16) return 'Très bien'; if(avg>=14) return 'Bien'; if(avg>=12) return 'Assez bien'; if(avg>=10) return 'Admis'; return 'À renforcer'; }
const BAC_COMPONENTS = [
  {id:'hg', label:'Histoire-Géographie', coef:6, group:'Contrôle continu'},
  {id:'lva', label:'LVA — Anglais', coef:6, group:'Contrôle continu'},
  {id:'lvb', label:'LVB — Espagnol', coef:6, group:'Contrôle continu'},
  {id:'ens', label:'Enseignement scientifique', coef:6, group:'Contrôle continu'},
  {id:'eps', label:'EPS', coef:6, group:'Contrôle continu'},
  {id:'emc', label:'EMC', coef:2, group:'Contrôle continu'},
  {id:'aband', label:'Spécialité abandonnée en Première', coef:8, group:'Contrôle continu'},
  {id:'francais', label:'Français — écrit + oral', coef:10, group:'Épreuves anticipées'},
  {id:'mathsAnt', label:'Mathématiques — épreuve anticipée', coef:2, group:'Épreuves anticipées'},
  {id:'hggsp', label:'HGGSP — spécialité', coef:16, group:'Épreuves terminales'},
  {id:'ses', label:'SES — spécialité', coef:16, group:'Épreuves terminales'},
  {id:'philo', label:'Philosophie', coef:8, group:'Épreuves terminales'},
  {id:'grandoral', label:'Grand oral', coef:8, group:'Épreuves terminales'}
];
function bacProjection(){
  const sim=STATE.bacSimulation||{};
  const target=Number(sim.target||14);
  let knownPoints=0, knownCoef=0, missingCoef=0;
  BAC_COMPONENTS.forEach(c=>{ const n=Number(sim[c.id]); if(Number.isFinite(n) && n>=0 && n<=20){knownPoints+=n*c.coef; knownCoef+=c.coef;} else missingCoef+=c.coef; });
  const projected=(knownPoints + missingCoef*target)/100;
  const knownAvg=knownCoef?knownPoints/knownCoef:null;
  return {target,knownPoints,knownCoef,missingCoef,projected,knownAvg};
}
function renderBac(){
  const el=document.getElementById('panel-bac'); if(!el) return;
  const sim=STATE.bacSimulation||{};
  const proj=bacProjection();
  const remaining=BAC_EXAMS_2027.filter(e=>e.date && e.date>=todayISO());
  const next=remaining[0];
  const groups=['Contrôle continu','Épreuves anticipées','Épreuves terminales'];
  el.innerHTML=`
    <div class="block">
      <div class="row-between"><div><div class="section-title" style="margin:0 0 4px;">Objectif Bac 2027</div><h2 style="margin:0;font-size:22px;">${proj.projected.toFixed(2)} / 20</h2></div><span class="badge2">40 % contrôle continu · 60 % terminal</span></div>
      <div style="margin-top:8px;color:var(--gold);font-family:'Fraunces',serif;">${bacMention(proj.projected)}</div>
      <div class="flow-meta" style="margin-top:8px;">Projection avec les notes déjà renseignées et <strong>${proj.target.toFixed(1)}/20</strong> comme hypothèse pour les éléments encore vides.</div>
      ${next?`<div class="flow-meta" style="margin-top:5px;">Prochaine grande échéance : ${esc(next.label)} le ${fmtDate(next.date)}.</div>`:''}
    </div>
    <div class="block">
      <h3>Simulateur Bac — renseigne les notes connues</h3>
      <div class="row-between" style="margin-bottom:8px;"><span class="flow-meta">Note d'objectif pour les cases vides</span><input id="bacTarget" type="number" min="0" max="20" step="0.1" value="${proj.target}" style="width:100px;"></div>
      ${groups.map(group=>`<div class="section-title">${group}</div>${BAC_COMPONENTS.filter(c=>c.group===group).map(c=>{
        const v=sim[c.id];
        return `<div class="flow-item" style="padding:8px 0;"><div class="flow-left"><div class="flow-title">${esc(c.label)} <span class="badge2">coef ${c.coef}</span></div></div><input class="bac-note" data-bac-id="${c.id}" type="number" min="0" max="20" step="0.1" placeholder="—" value="${v===undefined?'':esc(String(v))}" style="width:88px;flex:0 0 88px;"></div>`;
      }).join('')}`).join('')}
      <div id="bacCalcResult" class="ai-output" style="margin-top:12px;">${proj.knownCoef?`Notes renseignées : ${proj.knownCoef} coefficients sur 100 · moyenne des notes connues : ${proj.knownAvg.toFixed(2)}/20 · il reste ${proj.missingCoef} coefficients simulés à ${proj.target.toFixed(1)}/20.`:'Aucune note de Bac renseignée pour l’instant. Les cases vides utilisent l’objectif choisi.'}</div>
      <div class="footer-actions"><button class="btn secondary" id="bacResetBtn">Réinitialiser la simulation</button></div>
    </div>
    <div class="block">
      <h3>Les épreuves de Lorette</h3>
      <div class="flow">
        ${BAC_EXAMS_2027.map(e=>{
          const past=e.date && e.date<todayISO(); const date=e.date?fmtDate(e.date):'Date selon académie';
          return `<div class="flow-item"><div class="flow-left" style="--item-color:${e.kind==='Spécialité'?'var(--gold)':'var(--accent)'}"><div class="flow-title">${esc(e.label)} <span class="badge2">coef ${e.coef}</span></div><div class="flow-meta">${esc(e.kind)} · ${date} · ${esc(e.time)} · ${esc(e.note)}</div></div><span class="chip ${past?'':'tap'}">${past?'passée':'à préparer'}</span></div>`;
        }).join('')}
      </div>
    </div>
    <div class="block">
      <h3>À ne pas confondre</h3>
      <div class="ai-output" style="margin-top:0;">HGGSP et SES sont bien les <strong>2 spécialités</strong> de Lorette : elles comptent chacune coef 16 au Bac. L’EPS n’est pas une épreuve terminale du Bac général pour elle : elle compte dans le contrôle continu (coef 6). Le Grand oral n’est pas une matière séparée : il s’appuie notamment sur les connaissances des spécialités. Le français et l’épreuve anticipée de maths concernent la Première ; pour une élève en Terminale 2026–2027, elles sont normalement déjà passées.</div>
    </div>
    <div class="block">
      <h3>Préparer le Grand oral</h3>
      <div class="flow-meta">Choisir et affiner les questions liées à HGGSP / SES, construire l’argumentation, s’entraîner à parler clairement et chronométrer les simulations.</div>
      <div class="footer-actions"><button class="btn secondary" id="bacGrandOralBtn">Ouvrir Grand oral</button></div>
    </div>`;
  el.querySelector('#bacTarget').addEventListener('change', async e=>{ let v=parseFloat(e.target.value); if(!Number.isFinite(v)) v=14; STATE.bacSimulation={...(STATE.bacSimulation||{}),target:Math.max(0,Math.min(20,v))}; await saveKey('bacSimulation'); renderBac(); });
  el.querySelectorAll('.bac-note').forEach(input=>input.addEventListener('change', async e=>{ const id=e.target.dataset.bacId; const raw=e.target.value.trim(); const next={...(STATE.bacSimulation||{})}; if(raw==='') delete next[id]; else { const v=parseFloat(raw); if(!Number.isFinite(v)) return; next[id]=Math.max(0,Math.min(20,v)); } await saveKey('bacSimulation', next); renderBac(); }));
  el.querySelector('#bacResetBtn').addEventListener('click', async()=>{ STATE.bacSimulation={target:14}; await saveKey('bacSimulation'); renderBac(); });
  el.querySelector('#bacGrandOralBtn').addEventListener('click',()=>{activeTab='excellence'; excTool='grandoral'; renderTabs(); renderPanels();});
}
function migrateState(){
  // Old schedule entries labelled Histoire-Géographie were stored under HGGSP. Separate them safely.
  let changed=false;
  STATE.weeklyTemplate=(STATE.weeklyTemplate||[]).map(x=>{
    if(x.subject==='hggsp' && /^Histoire-Géographie\b/i.test(x.title||'')){ changed=true; return {...x,subject:'histgeo'}; }
    return x;
  });
  STATE.schedule=(STATE.schedule||[]).map(x=>{
    if(x.subject==='hggsp' && /^Histoire-Géographie\b/i.test(x.title||'')){ changed=true; return {...x,subject:'histgeo'}; }
    return x;
  });
  // Old todo records without dueType remain dated; empty/missing dates become undated.
  STATE.todos=(STATE.todos||[]).map(t=>{
    let x=t;
    if(!t.dueDate){ if(t.dueType!=='unknown' && t.dueType!=='none') {changed=true; x={...x,dueDate:null,dueType:'none'};} } else if(!t.dueType){changed=true; x={...x,dueType:'date'};}
    const status=x.status || (x.done?'done':'todo');
    if(x.status!==status){changed=true; x={...x,status};}
    return x;
  });
  if(changed) return Promise.all(['weeklyTemplate','schedule','todos'].map(saveKey));
  return Promise.resolve();
}

  renderTabs(); renderPanels();
}
init();

  <button class="btn" id="testMentionAi">Tester la connexion</button><div id="mentionAiTest" style="margin-top:10px"></div>`;
  document.body.appendChild(box);
  document.getElementById('closeMentionAi').onclick=()=>box.remove();

    const b=document.getElementById('testMentionAi'), o=document.getElementById('mentionAiTest');
    b.disabled=true; o.innerHTML='<div class="loading">Test réel de la connexion…</div>';
    try{
      const r=await fetch('/.netlify/functions/ai-health',{cache:'no-store'});
      const data=await r.json().catch(()=>({}));
      if(data.ok){
        o.innerHTML='<div style="color:var(--green);font-size:13px">✓ IA connectée — '+esc(data.model||'OpenRouter')+'</div>';
      }else{
        const details=[data.error,data.httpStatus?('HTTP '+data.httpStatus):'',data.requestId?('ID '+data.requestId):''].filter(Boolean).join(' — ');
        o.innerHTML='<div style="color:var(--red);font-size:13px">✕ '+esc(details||'Connexion impossible')+'</div>';
      }
    }catch(e){
      o.innerHTML='<div style="color:var(--red);font-size:13px">✕ '+esc(e.message||'Impossible de joindre la fonction IA')+'</div>';
    }finally{b.disabled=false;}
  };
}
</script>
