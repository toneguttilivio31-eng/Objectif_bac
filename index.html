<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Objectif Bac — Pilotage de Terminale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171d; --surface:#1a1e26; --surface-2:#20242e; --line:#282d38; --line-soft:#20242c;
  --ink:#ece8df; --ink-dim:#a2a4ac; --ink-faint:#686b74;
  --accent:#a4383f; --accent-soft:#332224; --gold:#c9a24b; --green:#4e9a6e; --red:#b5484f;
  --c-hggsp:#4e9a6e; --c-ses:#4d78b8; --c-histgeo:#b67a4d; --c-maths:#5b9bd5; --c-philo:#9a6bc4; --c-anglais:#c25b53;
  --c-espagnol:#d18a3c; --c-svt:#8c8058; --c-pc:#c4a83c; --c-emc:#83858e; --c-sport:#4e9a6e;
  --c-livio:#4d78b8; --c-lorette:#c25b8e;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Fraunces',serif;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
.app{max-width:820px;margin:0 auto;padding:0 18px 90px;}
.app-header{padding:24px 0 0;}
.brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.brand h1{font-size:23px;font-weight:600;margin:0;letter-spacing:.2px;}
.brand .tag{color:var(--gold);font-size:11.5px;font-style:italic;font-family:'Fraunces',serif;display:block;margin-top:2px;}
.who{display:flex;align-items:center;gap:6px;}
.avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;border:2px solid transparent;}
.avatar.active{border-color:var(--gold);}
.who-name{font-size:11px;color:var(--ink-faint);cursor:pointer;}
.sub{color:var(--ink-faint);font-size:12px;margin-top:6px;}
.tabs{display:flex;flex-wrap:wrap;gap:4px 2px;margin-top:16px;border-bottom:1px solid var(--line);}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;background:none;border:none;color:var(--ink-faint);padding:9px 10px 11px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);}
.panel{display:none;padding-top:20px;}
.panel.active{display:block;}
.block{background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 100%);border-radius:12px;padding:17px 18px;margin-bottom:18px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 6px 16px rgba(0,0,0,.18);border:1px solid var(--line-soft);}
.block h3{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--ink);}
.flow{margin-top:2px;}
.flow-item{padding:12px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.flow-item:last-child{border-bottom:none;}
.flow-left{border-left:2px solid var(--item-color,var(--accent));padding-left:11px;flex:1;min-width:0;}
.flow-title{font-weight:600;font-size:13.5px;}
.flow-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.flow-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin:24px 0 8px;font-weight:600;}
.section-title:first-child{margin-top:0;}
.section-title .count{color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-dim);}
.chip.tap{cursor:pointer;}
.chip.tap.active{border-color:var(--gold);color:var(--ink);}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block;}
.badge2{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-faint);}
.subject-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.subject-chips::-webkit-scrollbar{display:none;}
.subject-chip{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--ink-dim);white-space:nowrap;}
.subject-chip.active{border-color:var(--sc-color,var(--gold));color:var(--ink);background:var(--surface);}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line-soft);border-radius:6px;overflow:hidden;}
.subject-tile{background:var(--bg);border-left:3px solid var(--tile-color,var(--accent));padding:10px 11px;cursor:pointer;}
.subject-tile .name{font-weight:600;font-size:12.5px;}
.subject-tile .meta{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
label{display:block;font-size:11px;color:var(--gold);opacity:.85;margin:10px 0 4px;letter-spacing:.02em;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:9px;font-family:inherit;font-size:13.5px;transition:border-color .15s, box-shadow .15s;}
textarea{min-height:80px;resize:vertical;}
input[type=checkbox]{width:auto;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.12);}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--accent),#8c2f36);color:#f2ece7;border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(164,56,63,.25);}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.4;cursor:default;}
.btn.secondary{background:none;border:1px solid var(--line);color:var(--ink);}
.btn.ghost{background:none;border:none;color:var(--ink-faint);padding:4px 6px;font-size:11.5px;}
.btn.ghost:hover{color:var(--ink);}
.btn.big{padding:14px 22px;font-size:14.5px;width:100%;justify-content:center;}
.btn.tiny{padding:5px 10px;font-size:11.5px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.footer-actions{display:flex;justify-content:flex-end;margin-top:12px;}
.empty{color:var(--ink-faint);font-size:12.5px;padding:8px 0 4px;}
.empty .hint{color:var(--gold);font-style:italic;font-family:'Fraunces',serif;font-size:12.5px;display:block;margin-top:5px;}
.loading{color:var(--ink-faint);font-size:12px;font-style:italic;font-family:'Fraunces',serif;margin-top:10px;}
.loading::after{content:'';animation:dots 1.4s steps(4,end) infinite;}
@keyframes dots{0%,20%{content:'';}40%{content:'.';}60%{content:'..';}80%,100%{content:'...';}}
.ai-output{margin-top:10px;padding-left:12px;border-left:2px solid var(--gold);font-size:13px;white-space:pre-wrap;color:var(--ink-dim);line-height:1.6;}
.underline-tabs{display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;}
.utab{background:none;border:none;color:var(--ink-faint);padding:0 0 9px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;}
.utab.active{color:var(--ink);border-bottom-color:var(--gold);}
.grade-num{font-family:'Fraunces',serif;font-weight:600;}
.mono{font-variant-numeric:tabular-nums;}
.author-tag{font-size:9.5px;padding:1px 6px;border-radius:20px;color:#fff;font-weight:700;}
.imminent{color:var(--gold) !important;}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);cursor:pointer;}
.chapter{border-bottom:1px solid var(--line-soft);padding:13px 0;}
.chapter:last-child{border-bottom:none;}
.chapter-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.chapter-title{font-weight:600;font-size:13.5px;}
.chapter-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.session{border-left:2px solid var(--line);margin-left:2px;padding:10px 0 10px 14px;margin-top:8px;}
.review-card{background:var(--surface);border-radius:8px;padding:22px 18px;text-align:center;margin:12px 0;}
.review-q{font-size:15.5px;font-weight:600;font-family:'Fraunces',serif;}
.qcm-options{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.qcm-opt{padding:11px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;text-align:left;cursor:pointer;}
.qcm-opt.correct{border-color:var(--green);background:rgba(78,154,110,.15);color:var(--green);}
.qcm-opt.wrong{border-color:var(--red);background:rgba(181,72,79,.15);color:var(--red);}
.review-explain{margin-top:14px;color:var(--gold);font-size:13px;padding-top:14px;border-top:1px solid var(--line);text-align:left;}
.rate-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;}
.rate-btn{padding:9px 4px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:11.5px;cursor:pointer;}
.rate-btn.suggested{border-color:var(--gold);}
.todo-item{padding:11px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start;}
.todo-item:last-child{border-bottom:none;}
.todo-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px;}
.todo-check.done{background:var(--green);border-color:var(--green);color:#fff;}
.todo-title{font-weight:600;font-size:13.5px;}
.todo-title.done{text-decoration:line-through;color:var(--ink-faint);}
.todo-meta{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.todo-meta.overdue{color:var(--red);}
.chatbox{margin-top:6px;}
.chat-msg{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;max-width:88%;}
.chat-msg.user{background:var(--accent-soft);margin-left:auto;}
.chat-msg.assistant{background:var(--surface-2);color:var(--ink-dim);}
.daybox{background:var(--surface);border-radius:6px;padding:14px 15px;margin-bottom:10px;}
.daybox h4{margin:0 0 8px;font-size:12.5px;color:var(--gold);font-family:'Fraunces',serif;font-style:italic;font-weight:400;}
.searchbar{position:relative;margin-bottom:6px;}
/* Animations & polish */
.panel.active{animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.tab-btn{position:relative;transition:color .18s;}
.tab-btn.active::after{content:'';position:absolute;left:8%;right:8%;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;animation:tabIn .22s ease;}
@keyframes tabIn{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.btn, .subject-chip, .subject-tile, .todo-check, .qcm-opt, .chip.tap{transition:transform .12s ease, opacity .12s ease, background .15s ease, border-color .15s ease;}
.btn:active, .subject-chip:active, .todo-check:active, .qcm-opt:active{transform:scale(.96);}
.subject-tile:hover{transform:translateY(-1px);}
.flow-item{animation:fadeIn .22s ease;}
.review-card{animation:cardPop .22s ease;}
@keyframes cardPop{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.todo-check{transition:all .18s cubic-bezier(.4,0,.2,1);}
.todo-check.done{animation:checkPop .28s ease;}
@keyframes checkPop{0%{transform:scale(.6);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.subject-tile{position:relative;overflow:hidden;}
.subject-tile::before{content:'';position:absolute;inset:0;background:var(--tile-color);opacity:.05;pointer-events:none;}
.daybox{border-left:3px solid var(--gold);}
.daybox.today-box{border-left-color:var(--accent);}
/* Card flip for QCM reveal */
.flip-wrap{perspective:1000px;}
.flip-inner{transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.flip-wrap.flipped .flip-inner{transform:rotateY(180deg);}
.qcm-opt.reveal-pop{animation:revealPop .3s ease;}
@keyframes revealPop{0%{transform:scale(.94);}60%{transform:scale(1.02);}100%{transform:scale(1);}}
.session-body{overflow:hidden;transition:max-height .35s ease, opacity .3s ease;}
.chevron{display:inline-block;transition:transform .25s ease;}
.chevron.open{transform:rotate(180deg);}
.chat-bubble-btn{position:relative;display:inline-flex;align-items:center;gap:8px;}
.chat-bubble-btn .pulse{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulseDot 1.8s infinite;}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(201,162,75,.5);}70%{box-shadow:0 0 0 8px rgba(201,162,75,0);}100%{box-shadow:0 0 0 0 rgba(201,162,75,0);}}
.chat-msg{animation:slideUp .22s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.streak-flame{display:inline-block;animation:flicker 1.6s ease-in-out infinite;}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-1deg);}50%{transform:scale(1.08) rotate(1deg);}}
.success-burst{animation:burst .4s ease;}
@keyframes burst{0%{transform:scale(.7);opacity:0;}50%{transform:scale(1.1);opacity:1;}100%{transform:scale(1);}}
.progress-ring{transition:stroke-dashoffset .5s ease;}
.btn.big{position:relative;overflow:hidden;}
.btn.big::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-100%);}
.btn.big:hover::after{animation:shine .8s ease;}
@keyframes shine{to{transform:translateX(100%);}}

.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;}
.quick-card{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;}
.quick-card:hover{transform:translateY(-1px);border-color:var(--gold);background:var(--surface);}
.quick-card .qk-icon{font-size:18px;margin-bottom:5px;}
.quick-card .qk-title{font-size:12.5px;font-weight:600;}.quick-card .qk-meta{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
.today-task{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-soft);}.today-task:last-child{border-bottom:none;}
.today-task .task-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto;}.today-task.done .task-dot{background:var(--green);}.today-task.done .task-title{text-decoration:line-through;color:var(--ink-faint);}
.progress-bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px;}.progress-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .4s ease;}
.ai-hero{background:radial-gradient(circle at 100% 0,rgba(201,162,75,.12),transparent 42%),linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
.ai-chat-window{min-height:280px;max-height:52vh;overflow:auto;padding:4px 2px;}.ai-chat-input{display:flex;gap:8px;align-items:flex-end;margin-top:10px;}.ai-chat-input textarea{min-height:48px;max-height:140px;resize:vertical;}.ai-suggestion{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--ink-dim);font-size:11.5px;cursor:pointer;margin:4px 4px 0 0;}.ai-suggestion:hover{border-color:var(--gold);color:var(--ink);}
@media(max-width:420px){.quick-grid{grid-template-columns:1fr;}}

@media (min-width:720px){ .app{padding:0 24px 100px;} }

/* ============================= V9 — COACHING / NOMAD-INSPIRED UI ============================= */
.coach-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(164,56,63,.22),rgba(201,162,75,.10) 55%,rgba(78,154,110,.08));border:1px solid rgba(201,162,75,.18);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 14px 34px rgba(0,0,0,.24)}
.coach-hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-70px;top:-80px;background:radial-gradient(circle,rgba(201,162,75,.16),transparent 68%);pointer-events:none}
.coach-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:relative;z-index:1}
.coach-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700}
.coach-title{font-family:'Fraunces',serif;font-size:22px;line-height:1.1;margin:3px 0 4px}
.coach-sub{font-size:11.5px;color:var(--ink-dim);max-width:460px}
.xp-pill{border:1px solid rgba(201,162,75,.35);background:rgba(201,162,75,.08);border-radius:999px;padding:7px 10px;white-space:nowrap;font-size:11px;font-weight:700}
.coach-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.coach-metric{background:rgba(20,23,29,.55);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px}
.coach-metric .value{font-size:18px;font-weight:700;line-height:1.1}.coach-metric .label{font-size:9.5px!important;color:var(--ink-faint);margin:4px 0 0!important;text-transform:uppercase;letter-spacing:.06em}
.xp-track{height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:12px}.xp-track span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e5c878);border-radius:99px;transition:width .5s ease}
.mission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.mission-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:102px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}.mission-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.2);border-color:rgba(201,162,75,.35)}.mission-icon{font-size:20px}.mission-title{font-size:12.5px;font-weight:700;margin-top:6px}.mission-meta{font-size:10.5px;color:var(--ink-faint);margin-top:3px}
.revision-mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.revision-mode{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:13px;text-align:left;cursor:pointer;transition:transform .18s,border-color .18s,background .18s}.revision-mode:hover{transform:translateY(-2px);border-color:rgba(201,162,75,.4)}.revision-mode strong{display:block;font-size:12.5px}.revision-mode span{display:block;color:var(--ink-faint);font-size:10.5px;margin-top:3px}
.revision-plan{display:grid;gap:8px}.plan-row{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(255,255,255,.015)}.plan-icon{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);font-size:14px;flex:0 0 auto}.plan-main{min-width:0;flex:1}.plan-main strong{font-size:12px}.plan-main small{display:block;color:var(--ink-faint);font-size:10px;margin-top:2px}.course-date-badge{font-size:10px;color:var(--gold);border:1px solid rgba(201,162,75,.25);border-radius:999px;padding:2px 7px;white-space:nowrap}
@media(max-width:520px){.coach-metrics{grid-template-columns:repeat(3,1fr)}.coach-metric{padding:8px}.coach-metric .value{font-size:16px}.mission-grid,.revision-mode-grid{grid-template-columns:1fr 1fr}.coach-title{font-size:20px}.xp-pill{font-size:10px}}


.memory-card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,var(--surface-2),var(--surface));padding:15px;cursor:pointer;min-height:110px;transition:transform .2s,box-shadow .2s,border-color .2s}.memory-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.2);border-color:rgba(201,162,75,.35)}.memory-front{font-size:13px;font-weight:700}.memory-back{display:none;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-dim)}.memory-card.revealed .memory-back{display:block;animation:slideUp .2s ease}.memory-hint{font-size:9.5px;color:var(--gold);margin-top:8px}
/* ============================= V10 — COACHING GAME / POLISH ============================= */
.coach-shell{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin-bottom:16px;background:linear-gradient(145deg,#24202a 0%,#1b2029 45%,#171c24 100%);border:1px solid rgba(201,162,75,.18);box-shadow:0 18px 44px rgba(0,0,0,.28)}
.coach-shell:before{content:"";position:absolute;width:260px;height:260px;right:-110px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,75,.16),transparent 66%);pointer-events:none}

<body>
<div class="app">
  <div class="app-header">
    <div class="brand-row">
      <div class="brand"><h1>Objectif Bac</h1><span class="tag">année de Terminale, 2026–2027</span></div>
      <div class="who" id="whoRow"></div>
    </div>

  </div>

</div>

<script>
/* ============================= SUBJECTS & PROFILES ============================= */
const SUBJECTS = [
  {id:'hggsp',  name:'HGGSP',             type:'Spécialité',                         color:'var(--c-hggsp)'},
  {id:'ses',    name:'SES',               type:'Spécialité',                         color:'var(--c-ses)'},
  {id:'histgeo',name:'Histoire-Géographie',type:'Tronc commun',                     color:'var(--c-histgeo)'},
  {id:'maths',  name:'Mathématiques',     type:'Maths · épreuve anticipée du Bac', color:'var(--c-maths)'},
  {id:'philo',  name:'Philosophie',       type:'Tronc commun',                      color:'var(--c-philo)'},
  {id:'anglais',name:'Anglais',        type:'Langue vivante',    color:'var(--c-anglais)'},
  {id:'espagnol',name:'Espagnol',      type:'Langue vivante',    color:'var(--c-espagnol)'},
  {id:'svt',    name:'SVT',            type:'Tronc commun',      color:'var(--c-svt)'},
  {id:'pc',     name:'Physique-Chimie',type:'Tronc commun',      color:'var(--c-pc)'},
  {id:'emc',    name:'EMC',            type:'Enseignement moral et civique', color:'var(--c-emc)'},
  {id:'sport',  name:'EPS',            type:'Sport',             color:'var(--c-sport)'},
];
const subjById = id => SUBJECTS.find(s=>s.id===id) || SUBJECTS[0];
const PROFILES = [ {id:'livio', name:'Livio', color:'var(--c-livio)'}, {id:'lorette', name:'Lorette', color:'var(--c-lorette)'} ];
let whoAmI = null;
const WEEKDAYS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];

/* ============================= STATE (SHARED) ============================= */
let STATE = { weeklyTemplate:[], weeklyTemplateSeeded:false, schedule:[], chapters:{}, courses:{}, homework:[], todos:[], errors:[], grades:[], energy:[], subjectSynthesis:{}, homeworkSynthesis:{}, subjectChats:{}, examDates:[], streak:{lastVisit:null,count:0}, grandOralQuestions:[], grandOralAttempts:[], parcoursupList:[], weeklyGoals:[], sharedNotes:[], bacSimulation:{}, game:{xp:0,weeklyMinutes:0,weeklyStart:null,sessions:[],trophies:[],lastXPReason:''} };
const STORAGE_KEYS = ['weeklyTemplate','weeklyTemplateSeeded','schedule','chapters','courses','homework','todos','errors','grades','energy','subjectSynthesis','homeworkSynthesis','subjectChats','examDates','streak','grandOralQuestions','grandOralAttempts','parcoursupList','weeklyGoals','sharedNotes','bacSimulation'];

/* window.storage n'existe QUE dans l'environnement Claude (claude.ai / app Claude).
   Si ce fichier est hébergé ailleurs ou ouvert en local, cette API n'existe pas :
   on le détecte une fois pour toutes et on ne harcèle pas la console avec des essais voués à l'échec. */
const STORAGE_AVAILABLE = true;
const STORAGE_PREFIX = 'mention:v2:';
const STORAGE_SHARED = 'mention:v2:shared:';
const SYNC_ENDPOINT = '/.netlify/functions/sync';
let remoteSyncAvailable = false;
let lastRemoteStateHash = '';

function storageGet(key, shared=true){
  try{
    const raw = localStorage.getItem((shared?STORAGE_SHARED:STORAGE_PREFIX)+key);
    return raw === null ? null : {value:raw};
  }catch(e){ return null; }
}
function storageSet(key,value,shared=true){
  try{ localStorage.setItem((shared?STORAGE_SHARED:STORAGE_PREFIX)+key,value); return {ok:true}; }
  catch(e){ return null; }
}

async function remoteGet(key){
  const res = await fetch(`${SYNC_ENDPOINT}?key=${encodeURIComponent(key)}`, {cache:'no-store'});
  if(res.status===404) return null;
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `Synchronisation (${res.status})`);
  return data.value === undefined ? null : data.value;
}
async function remoteSet(key,value){
  const res = await fetch(SYNC_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key,value})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `Synchronisation (${res.status})`);
  return data;
}

async function loadState(){
  if(!STORAGE_AVAILABLE) return;
  let remoteOk=false;
  for(const k of STORAGE_KEYS){
    try{
      const remote = await remoteGet(k);
      if(remote !== null && remote !== undefined){
        STATE[k]=remote;
        storageSet(k, JSON.stringify(remote), true);
        remoteOk=true;
      }else{
        const local=storageGet(k,true);
        if(local && local.value) STATE[k]=JSON.parse(local.value);
      }
    }catch(e){
      const local=storageGet(k,true);
      if(local && local.value){ try{ STATE[k]=JSON.parse(local.value); }catch(_){} }
    }
  }
  remoteSyncAvailable=remoteOk;
  if(remoteOk) updateSyncBadge('Synchronisé entre les appareils');
  else updateSyncBadge('Mode local — synchronisation disponible après déploiement Netlify');
  try{ const w=storageGet('whoami',false); if(w && w.value) whoAmI=w.value; }catch(e){}
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
let syncError=false;
let syncErrorTimer=null;
async function saveKey(k, attempt){
  if(!STORAGE_AVAILABLE) return false;
  attempt=attempt||1;
  try{
    const value=STATE[k];
    storageSet(k, JSON.stringify(value), true);
    await remoteSet(k,value);
    remoteSyncAvailable=true;
    syncError=false;
    updateSyncBadge('Synchronisé');
    return true;
  }catch(e){
    if(attempt<2){ await sleep(700); return saveKey(k,attempt+1); }
    console.error('save failed',k,e);
    syncError=true;
    updateSyncBadge('Hors connexion — données conservées sur cet appareil');
    return false;
  }
}
async function retryAllSaves(){
  if(!STORAGE_AVAILABLE) return;
  syncError=false;
  for(const k of STORAGE_KEYS) await saveKey(k);
}
async function setWho(id){ whoAmI=id; try{ storageSet('whoami',id,false); }catch(e){} renderWho(); renderPanels(); }
function updateSyncBadge(text){
  const el=document.getElementById('headerSub');
  if(!el) return;
  const nbCourses=Object.values(STATE.courses||{}).reduce((a,c)=>a+(Array.isArray(c)?c.length:0),0);
  el.textContent=`Dossier partagé Livio & Lorette · ${SUBJECTS.length} matières · ${nbCourses||'aucune'} séance${nbCourses>1?'s':''} · ${text}`;
}
async function refreshRemoteState(){
  if(!remoteSyncAvailable) return;
  let changed=false;
  for(const k of STORAGE_KEYS){
    try{
      const remote=await remoteGet(k);
      if(remote===null || remote===undefined) continue;
      const before=JSON.stringify(STATE[k]);
      const after=JSON.stringify(remote);
      if(before!==after){ STATE[k]=remote; storageSet(k,after,true); changed=true; }
    }catch(e){ return; }
  }
  if(changed){
    updateSyncBadge('Mis à jour depuis le partage');
    const active=document.activeElement;
    const editing=active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    if(!editing) renderPanels();
  }
}
window.addEventListener('focus',()=>refreshRemoteState());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshRemoteState(); });

/* ============================= IMAGE COMPRESSION ============================= */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim=1100; let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } } else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg',0.58);
        resolve({data:dataUrl.split(',')[1], type:'image/jpeg', name:file.name});
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
async function readFilesMixed(fileList){
  const images=[], texts=[];
  for(const f of Array.from(fileList||[])){
    if(f.type.startsWith('image/')) { images.push(await compressImage(f)); continue; }
    const lower=(f.name||'').toLowerCase();
    if(['.txt','.md','.csv','.json','.xml'].some(x=>lower.endsWith(x))){
      texts.push({name:f.name,text:(await f.text()).slice(0,100000)}); continue;
    }
    // PDF/DOCX: send the binary to the secure Netlify extraction function.
    if(lower.endsWith('.pdf') || lower.endsWith('.docx')){
      const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(f);});
      const res=await fetch('/.netlify/functions/extract-document',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,type:f.type,data})});
      const out=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(out.error||`Impossible de lire ${f.name}`);
      texts.push({name:f.name,text:out.text||''}); continue;
    }
    // Unknown formats are kept as a text hint rather than silently crashing.
    texts.push({name:f.name,text:`Fichier ${f.name} (${f.type||'type inconnu'}) — format non extractible automatiquement.`});
  }
  return {images,texts};
}
function imgSrc(img){ return `data:${img.type};base64,${img.data}`; }
function renderThumbs(images){
  if(!images || !images.length) return '';
  return `<div class="thumbs">${images.map(im=>`<img src="${imgSrc(im)}" data-open-img title="${esc(im.name||'')}">`).join('')}</div>`;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function parcoursupLabel(v){ return {a_faire:'À préparer', envoyee:'Envoyée', attente:'En attente', admis:'Admis', liste_attente:"Liste d'attente", refuse:'Refusé'}[v] || v; }
function parcoursupColor(v){ return {a_faire:'var(--ink-faint)', envoyee:'var(--gold)', attente:'var(--gold)', admis:'var(--green)', liste_attente:'var(--gold)', refuse:'var(--red)'}[v] || 'var(--ink-faint)'; }
function sparklineSVG(values, color){
  if(!values || values.length<2) return '';
  const w=180, h=34, pad=3;
  const min=0, max=20;
  const stepX = (w-pad*2)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h - pad - ((v-min)/(max-min))*(h-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>
  </svg>`;
}

/* ============================= AI CALL ============================= */
async function askAI(prompt, opts={}){
  const endpoint = '/.netlify/functions/ai';
  const payload = {
    prompt,
    images: (opts.images||[]).map(im=>({data:im.data,type:im.type,name:im.name})),
    files: opts.texts || [],
    webSearch: !!opts.useWebSearch,
    system: opts.system || '',
    messages: Array.isArray(opts.messages) ? opts.messages : undefined,
    context: {
      app: 'Objectif Bac',
      studentLevel: 'Terminale générale',
      subjects: SUBJECTS.map(s=>s.name),
      currentSubject: opts.subject || null,
      currentChapter: opts.chapter || null
    }
  };
  const res = await fetch(endpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `Erreur IA (${res.status})`);
  if(!data.text) throw new Error('Réponse IA vide');
  return data.text;
}
async function askAIThread(thread, system){
  return askAI('', {system, messages:thread});
}

function safeParseJSON(text){
  try{ return JSON.parse(text); }
  catch(e){ const m=text.match(/\{[\s\S]*\}/); if(m){ try{ return JSON.parse(m[0]); }catch(e2){} } return {}; }
}

/* ============================= SPACED REPETITION (QCM + flashcard hybride) ============================= */
function newCard(q, options, correctIndex, explanation){ return {id:uid(), q, options, correctIndex, explanation, ease:2.5, interval:0, due:todayISO(), reps:0}; }
function updateCardSchedule(card, rating){
  card.reps=(card.reps||0)+1;
  if(rating===0){ card.interval=0; card.ease=Math.max(1.3,(card.ease||2.5)-0.2); }
  else if(rating===1){ card.interval=Math.max(1, Math.round((card.interval||1)*1.2)); card.ease=Math.max(1.3,(card.ease||2.5)-0.15); }
  else if(rating===2){ card.interval = card.interval? Math.round(card.interval*(card.ease||2.5)) : 1; }
  else { card.interval = Math.round((card.interval? card.interval*(card.ease||2.5) : 2)*1.3); card.ease=(card.ease||2.5)+0.15; }
  const d=new Date(); d.setDate(d.getDate()+Math.max(0,card.interval)); card.due = d.toISOString().slice(0,10);
}
function allCardsFlat(subjectFilter){
  const out=[];
  Object.entries(STATE.courses).forEach(([subj,list])=>{
    if(subjectFilter && subjectFilter!=='all' && subj!==subjectFilter) return;
    list.forEach(c=>(c.cards||[]).forEach(card=> out.push({subj, courseId:c.id, courseTitle:c.title, card})));
  });
  return out;
}

/* ============================= NAV ============================= */
const TABS = [
  {id:'accueil', label:'Accueil'}, {id:'emploi', label:'Emploi'}, {id:'cours', label:'Cours'},
  {id:'revisions', label:'Révisions'}, {id:'devoirs', label:'Devoirs'},
  {id:'notes', label:'Notes'}, {id:'bac', label:'Bac 2027'}, {id:'assistant', label:'Assistant IA'}, {id:'coaching', label:'Coaching'}, {id:'excellence', label:'Excellence'}, {id:'energie', label:'Énergie'},
];
let activeTab='accueil';
function renderWho(){
  const el=document.getElementById('whoRow');
  el.innerHTML = PROFILES.map(p=>`<div class="avatar ${whoAmI===p.id?'active':''}" style="background:${p.color}" data-who="${p.id}" title="${p.name}">${p.name[0]}</div>`).join('')
    + `<span class="who-name" id="whoLabel">${whoAmI?PROFILES.find(p=>p.id===whoAmI).name:'qui es-tu ?'}</span>`;
  el.querySelectorAll('[data-who]').forEach(a=>a.addEventListener('click', ()=>setWho(a.dataset.who)));
}
function authorTag(authorId){ const p=PROFILES.find(x=>x.id===authorId); return p ? `<span class="author-tag" style="background:${p.color}">${p.name[0]}</span>` : ''; }
function renderTabs(){
  const el=document.getElementById('tabs');
  el.innerHTML = TABS.map(t=>`<button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  el.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{ activeTab=b.dataset.tab; renderTabs(); renderPanels(); }));
}
function renderPanels(){
  const el=document.getElementById('panels');
  el.innerHTML = TABS.map(t=>`<div class="panel ${t.id===activeTab?'active':''}" id="panel-${t.id}"></div>`).join('');
  renderAccueil(); renderEmploi(); renderCours(); renderRevisions(); renderDevoirs(); renderNotes(); renderBac(); renderAssistant(); renderCoaching(); renderExcellence(); renderEnergie();
  document.querySelectorAll('[data-open-img]').forEach(img=>img.addEventListener('click', ()=>{ const w=window.open(); w.document.write(`<img src="${img.src}" style="max-width:100%;">`); }));
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}); }catch(e){ return d; } }
function fmtDayFull(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'}); }catch(e){ return d; } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function tomorrowISO(){ const d=new Date(); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10); }
function daysUntil(d){ return Math.ceil((new Date(d+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000); }
function isoPlusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function weekStartISO(){ const d=new Date(); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }

/* ============================= WEEKLY TEMPLATE OCCURRENCES ============================= */
function templateOccurrencesForDate(iso){
  const dayName = WEEKDAYS[(new Date(iso+'T00:00:00').getDay()+6)%7];
  return STATE.weeklyTemplate.filter(t=>t.day===dayName).sort((a,b)=>(a.time||'').localeCompare(b.time||''))
    .map(t=>({id:'tpl-'+t.id+'-'+iso, title:t.title, subject:t.subject, date:iso, time:t.time||'', template:true}));
}
function templateOccurrences(days){
  const occ=[]; for(let i=0;i<days;i++) occ.push(...templateOccurrencesForDate(isoPlusDays(i)));
  return occ;
}
function combinedEvents(days){
  const explicit = STATE.schedule.filter(e=>e.date>=todayISO());
  const tpl = templateOccurrences(days);
  return [...explicit, ...tpl].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
}
function eventsForDate(iso){
  const explicit = STATE.schedule.filter(e=>e.date===iso);
  const tpl = templateOccurrencesForDate(iso);
  return [...explicit, ...tpl].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}

/* ============================= WEAK SUBJECTS / UNTESTED CHAPTERS / SEARCH ============================= */
function computeGeneralAverage(){
  if(!STATE.grades.length) return null;
  let sum=0, coefSum=0; STATE.grades.forEach(g=>{ sum+=g.note*g.coef; coefSum+=g.coef; });
  return coefSum ? sum/coefSum : null;
}
function subjectAverage(subj){
  const gs = STATE.grades.filter(g=>g.subject===subj); if(!gs.length) return null;
  const sum=gs.reduce((a,g)=>a+g.note*g.coef,0), coefSum=gs.reduce((a,g)=>a+g.coef,0);
  return coefSum?sum/coefSum:null;
}
function weakSubjects(){
  const general = computeGeneralAverage(); if(general===null) return [];
  const out=[];
  SUBJECTS.forEach(s=>{ const avg=subjectAverage(s.id); if(avg!==null && (avg<12 || avg<general-1.5)) out.push({subj:s.id, avg}); });
  return out.sort((a,b)=>a.avg-b.avg);
}
function getChapters(subj){ if(!STATE.chapters[subj]) STATE.chapters[subj]=[]; return STATE.chapters[subj]; }
function untestedChapters(){
  const out=[];
  Object.entries(STATE.chapters).forEach(([subj,chs])=> chs.forEach(ch=>{
    const sessions=(STATE.courses[subj]||[]).filter(c=>c.chapterId===ch.id);
    if(!sessions.length) return;
    const hasReview = sessions.some(c=>(c.cards||[]).some(card=>card.reps>0));
    const hasHw = STATE.homework.some(h=>h.subject===subj && h.chapterId===ch.id) || STATE.todos.some(t=>t.subject===subj && t.chapterId===ch.id && t.done);
    if(!hasReview && !hasHw) out.push({subj, ch});
  }));
  return out;
}
function globalSearch(query){
  query=(query||'').toLowerCase().trim();
  if(!query) return {courses:[], homework:[], chapters:[]};
  const courses=[]; Object.entries(STATE.courses).forEach(([subj,list])=>list.forEach(c=>{ if((c.title+' '+(c.structured||'')+' '+(c.summary||'')).toLowerCase().includes(query)) courses.push({subj,course:c}); }));
  const homework = STATE.homework.filter(h=>((h.input||'')+' '+(h.output||'')).toLowerCase().includes(query));
  const chapters=[]; Object.entries(STATE.chapters).forEach(([subj,list])=>list.forEach(ch=>{ if(ch.title.toLowerCase().includes(query)) chapters.push({subj,ch}); }));
  return {courses,homework,chapters};
}
function exportBackup(){

}

function readChapterSelection(subj, idPrefix){
  const sel = document.getElementById(idPrefix+'ChapterSelect');

    const titleEl=document.getElementById(idPrefix+'NewChapterTitle');

    const title=(titleEl?.value||'').trim();

  }

async function resolveChapterSelection(subj, idPrefix){
  const pick=readChapterSelection(subj,idPrefix);
  if(!pick.isNew) return pick.id;
  if(!pick.title) return null;
  const ch=await createChapter(subj,pick.title,pick.multi);
  return ch.id;
}
async function ensurePendingChapter(subj,idPrefix){
  const pick=readChapterSelection(subj,idPrefix);
  if(!pick.isNew) return pick.id;
  if(!pick.title) throw new Error('Donne un titre au nouveau chapitre.');
  const ch=await createChapter(subj,pick.title,pick.multi);
  return ch.id;
}

function loadGame(){
  try{ const raw=localStorage.getItem('objectif-bac:game'); if(raw){ STATE.game=Object.assign(STATE.game,JSON.parse(raw)); } }catch(e){}
  if(!STATE.game.weeklyStart) STATE.game.weeklyStart=weekStartISO();
  if(!STATE.game.initialized){ const seed=(STATE.todos.filter(t=>t.done).length*10)+(Object.values(STATE.courses||{}).flat().length*8)+(STATE.streak.count||0)*10; STATE.game.xp=Math.max(STATE.game.xp||0,seed); STATE.game.initialized=true; saveGame(); }
  if(STATE.game.weeklyStart!==weekStartISO()){ STATE.game.weeklyStart=weekStartISO(); STATE.game.weeklyMinutes=0; STATE.game.sessions=[]; saveGame(); }
  checkTrophies(false);
}
function saveGame(){ try{localStorage.setItem('objectif-bac:game',JSON.stringify(STATE.game));}catch(e){} }
function divisionForXP(xp){ if(xp>=2500)return {name:'Diamant',icon:'💎',next:null}; if(xp>=1500)return {name:'Or',icon:'🥇',next:2500}; if(xp>=800)return {name:'Argent',icon:'🥈',next:1500}; return {name:'Bronze',icon:'🥉',next:800}; }
function addXP(amount,reason,minutes=0){
  const before=Math.floor((STATE.game.xp||0)/250)+1; STATE.game.xp=Math.max(0,(STATE.game.xp||0)+amount); STATE.game.lastXPReason=reason||''; STATE.game.weeklyMinutes=(STATE.game.weeklyMinutes||0)+Math.max(0,minutes||0);
  saveGame(); checkTrophies(true); const after=Math.floor((STATE.game.xp||0)/250)+1; showXPToast(`+${amount} XP${reason?' · '+reason:''}`); if(after>before) showLevelUp(after);
}
function checkTrophies(show=true){
  const unlocked=new Set(STATE.game.trophies||[]); const allCards=allCardsFlat('all'); const doneGoals=(STATE.weeklyGoals||[]).filter(g=>g.done).length;
  const checks={first:(STATE.game.sessions||[]).length>=1,streak3:(STATE.streak.count||0)>=3,streak7:(STATE.streak.count||0)>=7,xp100:(STATE.game.xp||0)>=100,xp500:(STATE.game.xp||0)>=500,qcm20:allCards.reduce((n,x)=>n+(x.card.reps||0),0)>=20,courses5:Object.values(STATE.courses||{}).reduce((n,a)=>n+(a||[]).length,0)>=5,goals5:doneGoals>=5};
  TROPHIES.forEach(t=>{ if(checks[t.id]&&!unlocked.has(t.id)){ unlocked.add(t.id); if(show) showXPToast(`🏆 Trophée débloqué · ${t.name}`); }});
  STATE.game.trophies=[...unlocked]; saveGame();
}
function showXPToast(text){ let el=document.getElementById('xpToast'); if(!el){el=document.createElement('div');el.id='xpToast';el.className='toast-xp';document.body.appendChild(el);} el.textContent=text; el.classList.add('show'); clearTimeout(window.__xpToastTimer); window.__xpToastTimer=setTimeout(()=>el.classList.remove('show'),2200); }
function showLevelUp(level){ let el=document.getElementById('levelUpOverlay'); if(el)el.remove(); el=document.createElement('div');el.id='levelUpOverlay';el.className='level-up';el.innerHTML=`<div class="level-card"><div class="level-icon">🚀</div><h2>Niveau ${level}</h2><p>Tu viens de franchir un nouveau cap. Continue comme ça.</p><button class="btn big" id="closeLevelUp">Continuer</button></div>`; document.body.appendChild(el); document.getElementById('closeLevelUp').onclick=()=>el.remove(); }

function coachingRecommendation(){
  const today=todayISO(); const exam=STATE.examDates.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const overdue=STATE.todos.filter(t=>!t.done&&t.dueDate&&t.dueDate<today).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  const due=allCardsFlat('all').filter(x=>x.card.due<=today).length;
  const weak=weakSubjects()[0];
  if(overdue)return {title:'Commence par ton devoir en retard',meta:overdue.text||'Un devoir attend encore.',tab:'devoirs'};
  if(exam&&daysUntil(exam.date)<=3)return {title:`Prépare ${exam.label}`,meta:`${daysUntil(exam.date)<=0?'Aujourd’hui':`dans ${daysUntil(exam.date)} jour(s)`} · une session ciblée te fera gagner du temps.`,tab:'revisions'};
  if(due)return {title:`Tu as ${due} notion(s) à revoir`,meta:'Une courte session suffit pour garder le rythme.',tab:'revisions'};
  if(weak)return {title:`Renforce ${subjById(weak.subj).name}`,meta:`Moyenne actuelle : ${weak.avg.toFixed(1)}/20 · travaille les notions faibles.`,tab:'revisions'};
  return {title:'Garde ton rythme aujourd’hui',meta:'Une petite session vaut mieux qu’une grosse session repoussée.',tab:'revisions'};
}

/* ============================= ACCUEIL ============================= */
function ensureStreak(){
  const today=todayISO();
  if(STATE.streak.lastVisit===today) return;
  const yesterday = isoPlusDays(-1);
  STATE.streak.count = (STATE.streak.lastVisit===yesterday) ? (STATE.streak.count||0)+1 : 1;
  STATE.streak.lastVisit = today;
  saveKey('streak');
}

function coachingStats(){
  const doneTodos=STATE.todos.filter(t=>t.done).length;
  const courseCount=Object.values(STATE.courses||{}).reduce((a,c)=>a+(Array.isArray(c)?c.length:0),0);
  const allCards=allCardsFlat('all');
  const reviewed=allCards.filter(x=>x.card.lastReviewed).length;
  const gradeCount=(STATE.grades||[]).length;
  const goalDone=(STATE.weeklyGoals||[]).filter(g=>g.done&&g.weekStart===weekStartISO()).length;
  const derivedXp=doneTodos*25+courseCount*20+reviewed*12+gradeCount*8+goalDone*35+(STATE.streak.count||0)*15;
  const xp=Math.max(STATE.game?.xp||0, derivedXp);
  const level=Math.max(1,Math.floor(xp/250)+1);
  const levelBase=(level-1)*250;
  const pct=Math.max(0,Math.min(100,Math.round(((xp-levelBase)/250)*100)));
  const next=level*250;
  const badges=[];
  if((STATE.streak.count||0)>=3) badges.push('🔥 Série de 3 jours');
  if(courseCount>=5) badges.push('📚 5 cours');
  if(doneTodos>=5) badges.push('✓ 5 tâches');
  if(reviewed>=10) badges.push('🧠 10 révisions');
  return {xp,level,pct,next,badges};
}

async function analyzeScheduleImages(){
  if(!pendingScheduleImages.length) return;
  const btn=document.getElementById('analyzeScheduleBtn'); btn.disabled=true;
  document.getElementById('scheduleAnalyzeStatus').innerHTML=`<div class="loading">Lecture de l'emploi du temps</div>`;
  const subjectList = SUBJECTS.map(s=>`${s.id} (${s.name})`).join(', ');
  try{
    const prompt = `Voici une ou plusieurs photos d'un emploi du temps hebdomadaire type de Terminale (valable toute l'année scolaire). Identifiants de matières disponibles : ${subjectList}.\n\nRéponds en JSON strict uniquement (pas de \`\`\`), tableau sous la clé "slots" : {"day":"lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche","time":"HH:MM","subject":"identifiant exact de la liste","title":"intitulé court, ex. Cours de SES"}. Un objet par créneau visible. Associe chaque matière au bon identifiant même si l'intitulé diffère (ex. "HIST.GEO.GEOPOL.S.P." -> "hggsp", "SC.ECONO.& SOCIALES" -> "ses", "ENSEIGN.SCIENTIFIQUE" -> "svt", "ED.PHYSIQUE & SPORT" -> "sport", "ANGLAIS LVA" -> "anglais", "ESPAGNOL LVB" -> "espagnol", "HISTOIRE-GEOGRAPHIE" -> "hggsp" si tronc commun sinon garder cohérent, "ENS.MORAL & CIVIQUE" -> "emc").`;
    const res = await askAI(prompt, {images: pendingScheduleImages});
    const parsed = safeParseJSON(res);
    const slots = (parsed.slots||[]).filter(sl=> WEEKDAYS.includes((sl.day||'').toLowerCase()) && subjById(sl.subject));
    if(!slots.length){ document.getElementById('scheduleAnalyzeStatus').innerHTML=`<div class="empty">Aucun créneau détecté, réessaie avec une photo plus nette.</div>`; return; }
    scheduleReview = slots.map(sl=>({id:uid(), day:sl.day.toLowerCase(), time:sl.time||'', subject:sl.subject, title:sl.title||`Cours de ${subjById(sl.subject).name}`}));
    renderScheduleReview();
  }catch(e){ document.getElementById('scheduleAnalyzeStatus').innerHTML=`<div class="empty">Échec de la lecture, réessaie.</div>`; console.error(e); }
  finally{ btn.disabled=false; }
}
function renderScheduleReview(){
  const box = document.getElementById('scheduleAnalyzeStatus');
  box.innerHTML = `<div class="block" style="margin-top:10px;">
    <h3>Vérifie avant d'intégrer (${scheduleReview.length} créneaux)</h3>
    ${scheduleReview.map(sl=>`<div class="row-between" style="padding:6px 0;border-bottom:1px solid var(--line-soft);" data-review-row="${sl.id}">
      <div style="font-size:12.5px;">${sl.day} ${sl.time} — <input data-review-title="${sl.id}" value="${esc(sl.title)}" style="width:120px;display:inline-block;padding:4px 6px;font-size:12px;">
      <select data-review-subject="${sl.id}" style="width:auto;display:inline-block;padding:4px 6px;font-size:12px;">${SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===sl.subject?'selected':''}>${s.name}</option>`).join('')}</select></div>
      <button class="btn ghost" data-review-del="${sl.id}">✕</button>
    </div>`).join('')}
    <div class="footer-actions"><button class="btn" id="confirmScheduleBtn">Confirmer et intégrer pour l'année</button></div>
  </div>`;
  box.querySelectorAll('[data-review-del]').forEach(b=>b.addEventListener('click', ()=>{ scheduleReview = scheduleReview.filter(s=>s.id!==b.dataset.reviewDel); renderScheduleReview(); }));
  box.querySelectorAll('[data-review-title]').forEach(inp=>inp.addEventListener('input', ()=>{ const it=scheduleReview.find(s=>s.id===inp.dataset.reviewTitle); if(it) it.title=inp.value; }));
  box.querySelectorAll('[data-review-subject]').forEach(sel=>sel.addEventListener('change', ()=>{ const it=scheduleReview.find(s=>s.id===sel.dataset.reviewSubject); if(it) it.subject=sel.value; }));
  document.getElementById('confirmScheduleBtn').addEventListener('click', async ()=>{
    STATE.weeklyTemplate = scheduleReview;
    await saveKey('weeklyTemplate');
    pendingScheduleImages=[]; scheduleReview=null;
    renderPanels();
  });
}

let calYear = calToday.getFullYear();
let calMonth = calToday.getMonth();
let calSelectedDate = todayISO();
const MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
function renderMonthCalendar(){
  const wrap = document.getElementById('monthCalendarWrap'); if(!wrap) return;
  const first = new Date(calYear, calMonth, 1);
  const startOffset = (first.getDay()+6)%7; // lundi=0
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);

  const dayItemsCount = (iso)=> eventsForDate(iso).length + STATE.todos.filter(t=>t.dueDate===iso).length;

  wrap.innerHTML = `
    <div class="block">
      <div class="row-between">
        <button class="btn ghost" id="calPrevBtn">◀</button>
        <div style="font-weight:600;font-family:'Fraunces',serif;">${MONTH_NAMES[calMonth]} ${calYear}</div>
        <button class="btn ghost" id="calNextBtn">▶</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px;text-align:center;">
        ${['L','M','M','J','V','S','D'].map(d=>`<div style="font-size:10.5px;color:var(--ink-faint);padding-bottom:4px;">${d}</div>`).join('')}
        ${cells.map(d=>{
          if(d===null) return `<div></div>`;
          const iso = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const isToday = iso===todayISO();
          const isSelected = iso===calSelectedDate;
          const count = dayItemsCount(iso);
          return `<div data-cal-day="${iso}" style="padding:8px 0;border-radius:6px;cursor:pointer;position:relative;
            ${isSelected?'background:var(--accent-soft);border:1px solid var(--accent);':isToday?'border:1px solid var(--gold);':''}">
            <div style="font-size:12.5px;${isToday?'color:var(--gold);font-weight:700;':''}">${d}</div>
            ${count?`<div style="width:4px;height:4px;border-radius:50%;background:var(--gold);margin:2px auto 0;"></div>`:''}
          </div>`;
        }).join('')}
      </div>
      <div class="footer-actions" style="justify-content:flex-start;margin-top:10px;"><button class="btn ghost tiny" id="calTodayBtn">Aujourd'hui</button></div>
    </div>
    <div id="calDayDetail"></div>
  `;
  document.getElementById('calPrevBtn').addEventListener('click', ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMonthCalendar(); });
  document.getElementById('calNextBtn').addEventListener('click', ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMonthCalendar(); });
  document.getElementById('calTodayBtn').addEventListener('click', ()=>{ calYear=calToday.getFullYear(); calMonth=calToday.getMonth(); calSelectedDate=todayISO(); renderMonthCalendar(); });
  wrap.querySelectorAll('[data-cal-day]').forEach(c=>c.addEventListener('click', ()=>{ calSelectedDate=c.dataset.calDay; renderMonthCalendar(); }));
  renderCalDayDetail();
}
function renderCalDayDetail(){
  const box = document.getElementById('calDayDetail'); if(!box) return;
  const iso = calSelectedDate;
  const evs = eventsForDate(iso);
  const todosDue = STATE.todos.filter(t=>t.dueDate===iso);
  box.innerHTML = `<div class="block">
    <h3>${fmtDayFull(iso)}</h3>
    ${evs.length ? evs.map(e=>{ const s=subjById(e.subject); return `<div class="row-between" style="padding:5px 0;"><span style="font-size:13px;border-left:3px solid ${s.color};padding-left:8px;">${esc(e.title)} <span style="color:var(--ink-faint);">· ${s.name}</span></span><span class="mono" style="font-size:12px;color:var(--ink-faint);">${e.time||''}</span></div>`; }).join('') : ''}
    ${todosDue.length ? todosDue.map(t=>`<div class="row-between" style="padding:5px 0;"><span style="font-size:13px;">${t.done?'✅ ':'📌 '}${esc(t.title)}</span><span style="font-size:11px;color:var(--ink-faint);">${subjById(t.subject).name}</span></div>`).join('') : ''}
    ${(!evs.length && !todosDue.length) ? `<div class="empty">Rien ce jour-là.</div>` : ''}
    <div class="footer-actions"><button class="btn secondary tiny" id="calAddHereBtn">+ Ajouter un événement ce jour</button></div>
  </div>`;
  document.getElementById('calAddHereBtn').addEventListener('click', ()=>{
    document.getElementById('evDate').value = iso;
    document.getElementById('addEventBlock').scrollIntoView({behavior:'smooth', block:'center'});
  });
}
function startCram(subj, chapterId){
  const sessions = (STATE.courses[subj]||[]).filter(c=>c.chapterId===chapterId);
  const cards=[]; sessions.forEach(c=>(c.cards||[]).forEach(card=>cards.push({subj,courseId:c.id,courseTitle:c.title,card})));
  if(!cards.length) return;
  revisionQueue = shuffle(cards); revisionIndex=0; revisionRevealed=false; revisionSessionActive=true; revisionSelected=null; window.__revisionSessionId=uid();
  activeTab='revisions'; renderTabs(); renderPanels();
}
function printChapterSheet(subj, chapterId){
  const ch = getChapters(subj).find(c=>c.id===chapterId); if(!ch) return;
  const sessions = (STATE.courses[subj]||[]).filter(c=>c.chapterId===chapterId);
  const subjName = subjById(subj).name;
  const win = window.open('', '_blank');
  const cardsHtml = sessions.map(c=>`
    <h3>Séance ${c.num} — ${esc(c.title)}</h3>
    <p><strong>Synthèse :</strong><br>${esc(c.summary||c.structured||'').replace(/\n/g,'<br>')}</p>
    ${(c.cards||[]).length ? `<p><strong>Cartes de révision :</strong></p><ol>${(c.cards||[]).map(card=>`<li>${esc(card.q)}<br><em>Réponse : ${esc(card.explanation||(card.options?card.options[card.correctIndex]:''))}</em></li>`).join('')}</ol>` : ''}
  `).join('<hr>');
  win.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>${esc(ch.title)} — ${esc(subjName)}</title>
    <style>
      body{font-family:Georgia,serif;max-width:700px;margin:30px auto;padding:0 20px;color:#111;line-height:1.5;}
      h1{font-size:22px;} h3{margin-top:24px;font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;}
      ol{padding-left:20px;} li{margin-bottom:10px;}
      hr{border:none;border-top:1px solid #ddd;margin:24px 0;}
      @media print{ body{margin:0;padding:14px;} }
    </style>
  </head><body>
    <h1>${esc(subjName)} — ${esc(ch.title)}</h1>
    <p style="color:#666;font-size:13px;">Fiche de révision générée le ${fmtDate(todayISO())}</p>
    ${cardsHtml}
    <script>window.onload=()=>window.print();<\/script>
  </body></html>`);
  win.document.close();
}

async function sendSubjectChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text) return;
  const subj = coursCurrentSubject;
  if(!STATE.subjectChats[subj]) STATE.subjectChats[subj]=[];
  STATE.subjectChats[subj].push({id:uid(), role:'user', text, date:todayISO(), author:whoAmI});
  await saveKey('subjectChats');
  input.value='';
  renderCours();
  document.getElementById('chatStatus').innerHTML = `<div class="loading">Réflexion</div>`;
  try{
    const thread = STATE.subjectChats[subj].slice(-8).map(m=>({role:m.role==='user'?'user':'assistant', text:m.text}));
    const res = await askAIThread(thread, `Tu es un tuteur de ${subjById(subj).name} pour un élève de Terminale française (bac 2027). Réponds de façon claire, pédagogique et concise (max 150 mots), sans jamais faire le travail rédigé à sa place s'il s'agit d'un devoir — donne des pistes.`);
    STATE.subjectChats[subj].push({id:uid(), role:'assistant', text:res, date:todayISO()});
    await saveKey('subjectChats');
    renderCours();
  }catch(e){ document.getElementById('chatStatus').innerHTML = `<div class="empty">Échec, réessaie.</div>`; }
}

async function generateCourse(){

  const courseDate=document.getElementById('courseDate')?.value || todayISO();
  const courseTime=document.getElementById('courseTime')?.value || '';
  let raw=document.getElementById('courseRaw').value.trim();
  if(pendingCourseTexts.length) raw += (raw?'\n\n':'') + pendingCourseTexts.map(t=>`[${t.name}]\n${t.text}`).join('\n\n');
  if(!raw && !pendingCourseImages.length){ document.getElementById('courseGenStatus').innerHTML=`<div class="empty">Ajoute du texte, une photo ou un fichier avant de générer.</div>`; return; }
  const pick=readChapterSelection(coursCurrentSubject,'course');
  if(pick.isNew && !pick.title){ document.getElementById('courseGenStatus').innerHTML=`<div class="empty">Donne un titre au nouveau chapitre.</div>`; return; }
  const btn=document.getElementById('genCourseBtn'); btn.disabled=true;
  document.getElementById('courseGenStatus').innerHTML=`<div class="loading">Lecture réelle des ${pendingCourseImages.length||0} photo(s) et préparation du cours…</div>`;
  const subject=subjById(coursCurrentSubject).name;
  const num=(STATE.courses[coursCurrentSubject]||[]).filter(c=>c.chapterId===pick.id).length+1;
  try{
    const prompt = `Tu es professeur de ${subject} en Terminale générale française (bac 2027).\n\nSOURCE DU COURS :${raw?`\n${raw}`:''}${pendingCourseImages.length?`\n\n${pendingCourseImages.length} photo(s) du cours sont jointes. Elles sont la source prioritaire.`:''}\n\nMISSION : traite toutes les pages dans leur ordre. Ne fais pas semblant de lire : utilise réellement le contenu visible des images. Si un mot est illisible, indique [illisible] plutôt que de l'inventer.\n\nRéponds en JSON valide uniquement, sans Markdown autour, avec exactement ces clés :\n1. "transcription" : retranscription fidèle et complète du contenu lisible des photos, dans l'ordre, en conservant les titres, sous-titres, définitions, dates, exemples, listes, noms propres et chiffres. Ne résume pas cette partie. Si le document contient des éléments manuscrits, retranscris-les lorsqu'ils sont lisibles.\n2. "structured" : cours propre et structuré à partir de la source, avec problématique, parties, notions clés et définitions, auteurs/références seulement s'ils apparaissent dans la source ou sont indispensables et clairement signalés. 350-650 mots.\n3. "summary" : fiche ultra-courte pour réviser rapidement, 8-15 points essentiels.\n4. "flashcards" : tableau de 8 à 12 objets {"front":"question/notion","back":"réponse courte"}.\n5. "quiz" : tableau de 10 objets {"q":"question","options":["4 choix"],"correctIndex":0,"explanation":"explication courte"}. Les réponses doivent venir de la source.\n6. "keyTerms" : tableau de 5 à 12 objets {"term":"notion","definition":"définition"}.`;
    const res = await askAI(prompt, {images: pendingCourseImages, system:`Pour cette tâche, la fidélité aux photos est prioritaire. La transcription doit être une retranscription, pas un résumé. Réponds uniquement avec le JSON demandé.`});
    const parsed = safeParseJSON(res);
    if(!parsed.transcription && !parsed.structured) throw new Error('La réponse IA n’a pas fourni le contenu du cours.');
    const chapterId = pick.isNew ? await ensurePendingChapter(coursCurrentSubject,'course') : pick.id;
    const cardsRaw = Array.isArray(parsed.quiz) ? parsed.quiz : [];
    const flashcardsRaw = Array.isArray(parsed.flashcards) ? parsed.flashcards : [];
    const keyTermsRaw = Array.isArray(parsed.keyTerms) ? parsed.keyTerms : [];
    document.getElementById('courseGenStatus').innerHTML=`<div class="loading">Enregistrement de la séance</div>`;
    let resources = '';
    try{
      resources = await askAI(`Donne 3 recherches YouTube pertinentes pour réviser en ${subject} le chapitre "${title}". Tu n'as pas à inventer de vidéo précise : donne uniquement des liens de recherche YouTube, un par ligne, avec un titre court.`, {system:'Ne donne jamais de fausse URL de vidéo. Utilise uniquement des URLs de recherche YouTube.'});
    }catch(e){ resources = 'Ressources vidéo indisponibles pour le moment.'; }
    const course = {id:uid(), chapterId: chapterId||null, num, title, date:courseDate, time:courseTime, author:whoAmI, raw: raw||'(photos)', images: pendingCourseImages,
      transcription:parsed.transcription||'', structured:parsed.structured||res, summary:parsed.summary||'', resources,
      keyTerms:keyTermsRaw.filter(x=>x&&x.term&&x.definition).slice(0,12),
      flashcards:flashcardsRaw.filter(x=>x&&x.front&&x.back).slice(0,12),
      cards: cardsRaw.filter(q=>q&&q.options && q.options.length===4).map(q=>newCard(q.q, q.options, Number(q.correctIndex)||0, q.explanation||''))};
    if(!STATE.courses[coursCurrentSubject]) STATE.courses[coursCurrentSubject]=[];
    STATE.courses[coursCurrentSubject].push(course);
    addXP(15,'nouveau cours');
    const saved = await saveKey('courses');
    pendingCourseImages=[]; pendingCourseTexts=[];
    if(chapterId) openChapterId = chapterId;
    document.getElementById('courseGenStatus').innerHTML = saved ? '' : `<div class="empty">La génération a réussi mais la sauvegarde a échoué. Le cours reste sur cet appareil ; vérifie la synchronisation.</div>`;
    renderCours();
  }catch(e){
    document.getElementById('courseGenStatus').innerHTML=`<div class="empty">Échec : ${esc(e?.message||'la lecture du cours a échoué')}. Le chapitre n'a pas été créé si la génération n'a pas réussi.</div>`;
    console.error(e);
  }finally{ btn.disabled=false; }
}

async function addTodo(analyzeWithAI=false){
  const title = document.getElementById('todoTitle').value.trim();
  const dateInput=document.getElementById('todoDate');
  const dueDate = dateInput.value || null;
  const dueType = dateInput.value ? 'date' : (dateInput.dataset.dueType || 'none');
  if(!title) return;
  const subject = document.getElementById('todoSubject').value;
  const chapterPick=readChapterSelection(subject,'todo');
  const chapterId = chapterPick.isNew ? (chapterPick.title ? await ensurePendingChapter(subject,'todo') : null) : chapterPick.id;
  if(chapterPick.isNew && !chapterPick.title){ document.getElementById('todoDueHint').textContent='Donne un titre au nouveau chapitre.'; return; }
  const statement=(document.getElementById('todoStatement')?.value||'').trim();
  const note=document.getElementById('todoNote').value.trim();
  const todo={id:uid(), title, subject, chapterId: chapterId||null, dueDate, dueType, statement, note, images: pendingTodoImages.slice(), done:false, status:'todo', doneDate:null, author:whoAmI, createdAt:Date.now(), aiAnalysis:''};
  STATE.todos.push(todo);
  const status=document.getElementById('todoAiStatus');
  if(analyzeWithAI){
    status.innerHTML=`<div class="loading">Analyse de l'énoncé et des photos…</div>`;
    try{
      const prompt=`Devoir de ${subjById(subject).name} en Terminale. Titre : ${title}.\nÉnoncé fourni par l'élève :\n${statement||'(voir les photos)' }\nNote personnelle : ${note||'(aucune)'}\n\nAnalyse le devoir à partir du texte et des photos. Donne : 1) ce qu'il faut réellement faire, 2) les notions à revoir, 3) les étapes de travail conseillées, 4) les pièges à éviter. Ne rédige pas le devoir à la place de l'élève. Si une information n'est pas lisible, signale-le.`;
      todo.aiAnalysis=await askAI(prompt,{images:pendingTodoImages,system:'Lis réellement les images jointes. Réponds en français, avec des titres courts et des conseils concrets.'});
    }catch(e){ todo.aiAnalysis=`Analyse IA indisponible : ${e?.message||'erreur'}`; }
  }
  await saveKey('todos');
  pendingTodoImages=[];
  renderTodos();
}

async function runDevoir(){
  const subject=devoirsSubject;
  let input=document.getElementById('dvInput').value.trim();
  if(pendingDvTexts.length) input += (input?'\n\n':'') + pendingDvTexts.map(t=>`[${t.name}]\n${t.text}`).join('\n\n');
  if(!input && !pendingDvImages.length) return;
  const chapterPick = readChapterSelection(subject,'dv');
  if(chapterPick.isNew && !chapterPick.title){ document.getElementById('dvStatus').innerHTML=`<div class="empty">Donne un titre au nouveau chapitre.</div>`; return; }
  const btn=document.getElementById('dvBtn'); btn.disabled=true;
  document.getElementById('dvStatus').innerHTML=`<div class="loading">${devoirsMode==='aide'?'Analyse du sujet':'Correction de la copie'}</div>`;
  const subjName=subjById(subject).name;
  const hasImages = pendingDvImages.length>0;
  try{
    let prompt, extraSystem;
    if(devoirsMode==='aide'){
      extraSystem="Règle absolue : tu ne rédiges jamais le devoir à la place de l'élève. Tu donnes uniquement une analyse du sujet, une problématique possible, et un plan indicatif avec 2-3 idées par partie.";
      prompt=`Sujet de ${subjName} en Terminale${hasImages?' (fourni en photo/fichier)':''}${input?` : "${input}"`:'.'}\n\nAide-moi à comprendre le sujet : termes clés à définir, problématique possible, plan indicatif (2-3 pistes par partie). Ne rédige aucun paragraphe complet.`;
    }else{
      const priorErrors = STATE.errors.filter(e=>e.subject===subject).slice(-5).map(e=>e.fromCorrection?null:e.text).filter(Boolean);
      extraSystem="Tu es un correcteur exigeant du baccalauréat français, rigoureux mais constructif.";
      prompt=`Voici une copie d'élève de Terminale en ${subjName}${hasImages?' (fournie en photo/fichier)':''}${input?` :\n\n${input}`:'.'}\n\n${priorErrors.length?`Erreurs déjà repérées chez cet élève par le passé dans cette matière : ${priorErrors.join(' / ')}. Signale explicitement si l'une d'elles se répète.\n\n`:''}Corrige-la comme au baccalauréat : note sur 20 avec justification précise, 2-3 points forts, 2-3 failles à corriger, un conseil concret. Commence par la ligne exacte "NOTE: X/20" puis le reste.`;
    }
    const res=await askAI(prompt,{system:`${extraSystem}
Analyse réellement toutes les photos jointes. Si une partie est illisible, dis-le. Ne prétends jamais avoir lu une consigne absente.`, images: hasImages?pendingDvImages:undefined});
    const chapterId = chapterPick.isNew ? await ensurePendingChapter(subject,'dv') : chapterPick.id;
    let grade=null; const m=res.match(/NOTE:\s*([\d.,]+)\s*\/\s*20/i); if(m) grade=parseFloat(m[1].replace(',','.'));
    STATE.homework.push({id:uid(), subject, chapterId: chapterId||null, mode:devoirsMode, input: input||'(photo/fichier)', output:res, grade, date:todayISO(), author:whoAmI, images: pendingDvImages});
    const saved = await saveKey('homework');
    if(devoirsMode==='correction'){ STATE.errors.push({id:uid(), subject, text:res, date:todayISO(), author:whoAmI, fromCorrection:true}); await saveKey('errors'); }
    pendingDvImages=[]; pendingDvTexts=[];
    document.getElementById('dvStatus').innerHTML = saved ? '' : `<div class="empty">Traité mais la sauvegarde a échoué — réessaie.</div>`;
    renderDevoirsIA();
  }catch(e){ document.getElementById('dvStatus').innerHTML=`<div class="empty">Échec, réessaie.</div>`; }
  finally{ btn.disabled=false; }
}
async function regenerateHomeworkSynthesis(){
  const subject = devoirsCurrentSubject;
  const items = STATE.homework.filter(h=>h.subject===subject);
  if(!items.length) return;
  const btn=document.getElementById('regenHwSynthBtn'); btn.disabled=true;
  document.getElementById('hwSynthStatus').innerHTML = `<div class="loading">Analyse</div>`;
  try{
    const combined = items.map(h=>`[${h.mode==='aide'?'Aide':'Correction'}${h.grade!=null?`, note ${h.grade}/20`:''}]\n${h.output}`).join('\n\n');
    const prompt = `Voici l'historique des devoirs traités en ${subjById(subject).name} de Terminale cette année :\n\n${combined}\n\nFais un bilan consolidé : progression générale, difficultés récurrentes, 2-3 priorités de travail. 150-250 mots.`;
    const res = await askAI(prompt);
    STATE.homeworkSynthesis[subject] = res;
    await saveKey('homeworkSynthesis');
    renderDevoirsIA();
  }catch(e){ document.getElementById('hwSynthStatus').innerHTML=`<div class="empty">Échec, réessaie.</div>`; }
  finally{ btn.disabled=false; }

function renderNotes(){
  const el=document.getElementById('panel-notes');
  const bySubject={}; STATE.grades.forEach(g=>{ (bySubject[g.subject]=bySubject[g.subject]||[]).push(g); });
  const general=computeGeneralAverage();
  el.innerHTML = `
    <div class="block">
      <h3>Ajouter une note</h3>
      <label>Matière</label><select id="gSubject">${SUBJECTS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
      <div class="row">
        <div style="flex:1;"><label>Note /20</label><input id="gNote" type="number" min="0" max="20" step="0.5"></div>
        <div style="flex:1;"><label>Coefficient</label><input id="gCoef" type="number" min="1" step="0.5" value="1"></div>
      </div>
      <label>Intitulé (optionnel)</label><input id="gLabel" placeholder="ex. DS n°2, Bac blanc…">
      <div class="footer-actions"><button class="btn" id="gAddBtn">Enregistrer</button></div>
    </div>
    <div class="block">
      <h3>Simulateur d'objectif</h3>
      <div class="row">
        <div style="flex:1;"><label>Moyenne visée</label><input id="simTarget" type="number" min="0" max="20" step="0.1" value="16"></div>
        <div style="flex:1;"><label>Coef. du prochain contrôle</label><input id="simCoef" type="number" min="1" step="0.5" value="1"></div>
      </div>
      <div class="footer-actions"><button class="btn secondary" id="simBtn">Calculer</button></div>
      <div id="simResult"></div>
    </div>
    <div class="section-title">Moyenne générale : <span class="grade-num">${general!==null?general.toFixed(2):'—'} / 20</span></div>
    ${SUBJECTS.map(s=>{
      const gs=bySubject[s.id]; if(!gs) return '';
      const sum=gs.reduce((a,g)=>a+g.note*g.coef,0), coefSum=gs.reduce((a,g)=>a+g.coef,0);
      const avg=coefSum?sum/coefSum:null;
      const chrono = gs.slice().sort((a,b)=>a.date.localeCompare(b.date));
      return `<div style="margin-bottom:16px;">
        <div class="row-between" style="border-left:3px solid ${s.color};padding-left:10px;margin-bottom:4px;">
          <h3 style="margin:0;font-size:13.5px;">${s.name}</h3><span class="grade-num">${avg!==null?avg.toFixed(2):'—'} / 20</span>
        </div>
        ${chrono.length>1 ? `<div style="padding-left:10px;margin-bottom:6px;">${sparklineSVG(chrono.map(g=>g.note), s.color)}</div>` : ''}
        <div class="flow">
        ${gs.slice().reverse().map(g=>`<div class="flow-item" style="padding:7px 0 7px 10px;">
          <div class="flow-meta" style="font-size:12px;color:var(--ink);">${esc(g.label)||'Note'} <span style="color:var(--ink-faint);">coef ${g.coef}</span></div>
          <div class="row"><span class="mono" style="font-size:12px;">${g.note}/20</span><button class="btn ghost" data-del-grade="${g.id}">✕</button></div>
        </div>`).join('')}
        </div>
      </div>`;
    }).join('') || `<div class="empty">Aucune note enregistrée.</div>`}
  `;
  el.querySelector('#gAddBtn').addEventListener('click', async ()=>{
    const note=parseFloat(document.getElementById('gNote').value); const coef=parseFloat(document.getElementById('gCoef').value)||1;
    if(isNaN(note)) return;
    STATE.grades.push({id:uid(), subject:document.getElementById('gSubject').value, note, coef, label:document.getElementById('gLabel').value.trim(), date:todayISO(), author:whoAmI});
    await saveKey('grades'); renderNotes();
  });
  el.querySelectorAll('[data-del-grade]').forEach(b=>b.addEventListener('click', async ()=>{ STATE.grades=STATE.grades.filter(g=>g.id!==b.dataset.delGrade); await saveKey('grades'); renderNotes(); }));
  el.querySelector('#simBtn').addEventListener('click', ()=>{
    const target=parseFloat(document.getElementById('simTarget').value); const nextCoef=parseFloat(document.getElementById('simCoef').value)||1;
    const sum=STATE.grades.reduce((a,g)=>a+g.note*g.coef,0), coefSum=STATE.grades.reduce((a,g)=>a+g.coef,0);
    const needed=((target*(coefSum+nextCoef))-sum)/nextCoef;
    const out=document.getElementById('simResult');
    if(needed>20) out.innerHTML=`<div class="ai-output">Même un 20/20 ne suffira pas cette fois — vise un rattrapage sur plusieurs contrôles.</div>`;
    else if(needed<0) out.innerHTML=`<div class="ai-output">Objectif déjà atteint, même avec un 0/20.</div>`;
    else out.innerHTML=`<div class="ai-output">Il faut au moins <strong>${needed.toFixed(1)}/20</strong> au prochain contrôle (coef ${nextCoef}).</div>`;
  });
}

const SEED_PHILO_ID = 'seed-philo-bonheur-art-1';
const SEED_PHILO_NOTE = `Sujet : choisir un mot dans la liste des notions du programme (M. Lagarde), en donner une définition personnelle, expliquer pourquoi ce mot a été choisi et ce qu'il évoque.

LE BONHEUR
Pour moi, le bonheur, c'est surtout le fait de se sentir bien et de profiter de sa vie. J'ai choisi ce mot parce que je pense que tout le monde cherche à être heureux, mais pas de la même façon. Pour certains, ça peut être avoir de l'argent ou réussir dans la vie. Pour moi, ça peut aussi être quelque chose de simple, comme être avec une personne qu'on aime et passer un bon moment. Je pense qu'on peut être heureux sans avoir tout ce qu'on veut. Le bonheur dépend donc beaucoup de ce qu'on ressent et de ce qui compte vraiment pour nous. Il peut aussi venir de petits moments qu'on ne pense pas forcément à apprécier sur le moment. Mais je pense qu'on ne peut pas être heureux tout le temps. C'est justement pour ça que les moments où on est vraiment heureux sont importants.

L'ART
Pour moi, l'art, c'est une façon de montrer quelque chose ou de faire passer un message. J'ai choisi ce mot parce que l'art peut prendre beaucoup de formes différentes : la peinture, la musique, le cinéma, le dessin ou même la danse. Je pense que chacun peut voir une œuvre d'une façon différente. Une chose peut plaire à une personne et pas du tout à une autre. L'art peut aussi permettre de montrer des émotions qu'on a parfois du mal à expliquer avec des mots. Pour moi, c'est surtout une façon de s'exprimer et de faire ressentir quelque chose aux autres.`;
